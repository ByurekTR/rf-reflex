name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # lets the last step publish the APK as a release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Question tests (every formula and question type)
        run: node tests/engine.test.js

      - name: Build signed release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --refresh-dependencies 2>&1 | tee build.log

      # Puts the reason for a failed build on the run's summary page.
      - name: Report build errors
        if: failure()
        shell: bash
        run: |
          [ -f build.log ] || exit 0
          { grep -E "error: |ERROR|AAPT" build.log || true; } | head -n 8 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          what="$(awk '/\* What went wrong:/{p=1;next} /\* Try:/{p=0} p' build.log | head -n 25 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')"
          if [ -n "$what" ]; then echo "::error title=What went wrong::${what}"; fi
          exit 0

      - name: Verify the APK requests no INTERNET permission
        shell: bash
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt2"
          "$AAPT2" dump permissions "$APK" | tee permissions.txt
          if grep -q "android.permission.INTERNET" permissions.txt; then
            echo "::error::The merged manifest contains android.permission.INTERNET"
            exit 1
          fi
          echo "OK: no INTERNET permission in the APK."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RfReflex-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      # Gives the phone a direct download link: <repo>/releases/latest
      - name: Publish APK as a release
        if: github.event_name != 'pull_request'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk RF-Reflex.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest RF-Reflex.apk --title "RF Reflex (latest build)" --notes "Built from ${GITHUB_SHA}" --target "${GITHUB_SHA}"
